services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threes
      POSTGRES_PASSWORD: threes
      POSTGRES_DB: threes_dev
    ports:
      # Host port 5433 (not 5432) to avoid clashing with a locally-installed
      # Postgres. Inside the compose network the service is still "postgres:5432".
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threes"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    env_file: .env
    environment:
      # Overrides .env's DATABASE_URL: inside the compose network the postgres
      # service is reachable at hostname "postgres", not "localhost".
      DATABASE_URL: postgresql+asyncpg://threes:threes@postgres:5432/threes_dev
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  pg_data:
