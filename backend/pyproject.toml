[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threes-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "sqlalchemy>=2.0,<3.0",
  "greenlet>=3.1,<4.0",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.14,<2.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  # [crypto] pulls in `cryptography`, which PyJWT needs for the ES256 keys a
  # real Supabase project signs with. Without it ES256 is not even registered.
  "pyjwt[crypto]>=2.9,<3.0",
  # Runtime, not just a test client: app/services/realtime.py posts the
  # Supabase broadcast that tells clients to refetch the leaderboard.
  "httpx>=0.27,<0.28",
  "email-validator>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.7,<0.8",
  "mypy>=1.13,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
