# fly.toml app configuration file generated for threes-api on 2026-08-31T22:37:42+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Regenerated by `fly launch`, which strips comments — so if it is run again,
# check the http_checks block below survived. Two things here are decisions
# rather than defaults, and both are noted where they are made.

app = 'threes-api'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'alembic upgrade head'

[env]
  ENVIRONMENT = 'production'

[http_service]
  internal_port = 8000
  force_https = true
  # Always warm, deliberately, and the reason this app is not cheaper to run: a
  # cold start between two holes is the failure that matters. A group standing on
  # a green waiting for a machine to boot will decide the app is broken, and they
  # will be right for the ten seconds it takes.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Without this Fly knows only that the machine booted, not that the app is
  # serving — so a container that starts and then 500s on every request still
  # takes traffic. /health is the one route that needs no bearer token
  # (app/main.py); every other path would answer 403 to a prober.
  [[http_service.http_checks]]
    path = '/health'
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
