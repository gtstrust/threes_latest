<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap">
  <style>
    :root {
      /* Dark: the brand register. Near-black with a green cast rather than
         neutral grey, so the app reads as one colour family. */
      --page: #0b0f0c;
      --surface: #141a15;
      --raised: #1c241d;
      --line: #263028;
      --ink: #f2f6f2;
      --muted: #8fa091;
      /* Luminous green for state. The shipped brand green (#1b5e20) is too
         dark to carry contrast on near-black, so this is its bright sibling. */
      --accent: #4ade80;
      --accent-ink: #06210f;
      --warn: #fbbf24;
      --danger: #f87171;
    }
    .lit {
      /* High-luminance: the on-course theme. Bright screens beat dark ones in
         direct sun, which is where score entry actually happens. */
      --page: #ffffff;
      --surface: #ffffff;
      --raised: #f1f4f1;
      --line: #d9e0da;
      --ink: #0d130e;
      --muted: #5b665c;
      --accent: #1b5e20;
      --accent-ink: #ffffff;
      --warn: #92610a;
      --danger: #a4231f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--accent); }
    a:hover { color: var(--ink); }
    .scr {
      width: 390px; min-height: 844px; background: var(--page); color: var(--ink);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 17px; line-height: 1.45; padding: 20px 18px 28px;
      display: flex; flex-direction: column; gap: 14px;
    }
    /* Archivo only for display: headings and the big numbers. Body stays on the
       system stack so first paint over 4G is unchanged. */
    .dsp { font-family: Archivo, system-ui, sans-serif; font-weight: 800;
           letter-spacing: -0.02em; margin: 0; }
    h1.dsp { font-size: 28px; line-height: 1.1; }
    h2.dsp { font-size: 13px; font-weight: 700; letter-spacing: 0.09em;
             text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
    .num { font-variant-numeric: tabular-nums; font-family: Archivo, system-ui, sans-serif; }
    .card { background: var(--surface); border: 1px solid var(--line);
            border-radius: 14px; padding: 16px; }
    .btn { font: inherit; font-weight: 700; min-height: 48px; width: 100%;
           border: 0; border-radius: 12px; background: var(--accent);
           color: var(--accent-ink); cursor: pointer; display: flex;
           align-items: center; justify-content: center; gap: 8px; }
    .btn.sec { background: var(--raised); color: var(--ink);
               border: 1px solid var(--line); }
    .btn.ghost { background: transparent; color: var(--muted);
                 border: 1px solid var(--line); min-height: 44px; }
    .fld { font: inherit; color: var(--ink); background: var(--raised);
           border: 1px solid var(--line); border-radius: 12px; min-height: 48px;
           padding: 12px 14px; width: 100%; }
    .lbl { font-size: 13px; font-weight: 700; color: var(--muted);
           letter-spacing: 0.04em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .sm { font-size: 14px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stack { display: flex; flex-direction: column; }
    .pill { font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
            text-transform: uppercase; padding: 4px 9px; border-radius: 999px;
            border: 1px solid var(--line); color: var(--muted); }
    .pill.live { color: var(--accent-ink); background: var(--accent);
                 border-color: transparent; }
    .pill.warn { color: var(--warn); border-color: var(--warn); }
  </style>
</helmet>
<div class="scr {{theme}}">

  <div class="row">
    <div>
      <h1 class="dsp" style="font-size:24px">Your golf</h1>
      <p class="muted sm" style="margin:2px 0 0">kim@acme.com</p>
    </div>
    <span class="pill">Edit</span>
  </div>

  <div class="card stack" style="gap:7px">
    <label class="lbl" for="dn">Display name</label>
    <input class="fld" id="dn" value="Kim Nguyen">
    <p class="muted sm" style="margin:0">This is the name on leaderboards. Without it, your email shows instead.</p>
  </div>

  <div class="card">
    <h2 class="dsp">Career</h2>
    <div style="display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px 10px">
      <sc-for list="{{figures}}" as="f" hint-placeholder-count="6">
        <div><div class="num dsp" style="font-size:23px">{{f.v}}</div><div class="muted sm">{{f.k}}</div></div>
      </sc-for>
    </div>
  </div>

  <div class="card">
    <h2 class="dsp">Royal Melbourne</h2>
    <p class="muted sm" style="margin:-4px 0 12px">4 rounds · 4.31 per hole</p>
    <div style="display:grid; grid-template-columns:0.7fr repeat(3, minmax(0,1fr)); gap:9px 6px">
      <span class="lbl">Hole</span><span class="lbl" style="text-align:right">Avg</span>
      <span class="lbl" style="text-align:right">Best</span><span class="lbl" style="text-align:right">Won</span>
      <sc-for list="{{holes}}" as="h" hint-placeholder-count="3">
        <span class="num">{{h.n}}</span>
        <span class="num" style="text-align:right">{{h.avg}}</span>
        <span class="num" style="text-align:right">{{h.best}}</span>
        <span class="num muted" style="text-align:right">{{h.won}}</span>
      </sc-for>
    </div>
  </div>

  <div class="card">
    <h2 class="dsp">Bring a mate</h2>
    <div class="row">
      <span class="num dsp" style="font-size:19px; letter-spacing:0.1em">MATE-5BQ5K</span>
      <span class="muted sm">2 joined</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;lit&quot;],&quot;default&quot;:&quot;lit&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark', figures: [{v:'7',k:'Rounds'},{v:'21',k:'Holes'},{v:'9',k:'Won'},{v:'43%',k:'Win rate'},{v:'4.31',k:'Per hole'},{v:'90',k:'Strokes'}], holes: [{n:'4',avg:'4.25',best:'3',won:'2/4'},{n:'5',avg:'3.75',best:'3',won:'1/4'},{n:'6',avg:'4.92',best:'4',won:'1/4'}] };
  }
}
</script>
</body>
</html>
