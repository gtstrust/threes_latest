<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap">
  <style>
    :root {
      /* Dark: the brand register. Near-black with a green cast rather than
         neutral grey, so the app reads as one colour family. */
      --page: #0b0f0c;
      --surface: #141a15;
      --raised: #1c241d;
      --line: #263028;
      --ink: #f2f6f2;
      --muted: #8fa091;
      /* Luminous green for state. The shipped brand green (#1b5e20) is too
         dark to carry contrast on near-black, so this is its bright sibling. */
      --accent: #4ade80;
      --accent-ink: #06210f;
      --warn: #fbbf24;
      --danger: #f87171;
    }
    .lit {
      /* High-luminance: the on-course theme. Bright screens beat dark ones in
         direct sun, which is where score entry actually happens. */
      --page: #ffffff;
      --surface: #ffffff;
      --raised: #f1f4f1;
      --line: #d9e0da;
      --ink: #0d130e;
      --muted: #5b665c;
      --accent: #1b5e20;
      --accent-ink: #ffffff;
      --warn: #92610a;
      --danger: #a4231f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--accent); }
    a:hover { color: var(--ink); }
    .scr {
      width: 390px; min-height: 844px; background: var(--page); color: var(--ink);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 17px; line-height: 1.45; padding: 20px 18px 28px;
      display: flex; flex-direction: column; gap: 14px;
    }
    /* Archivo only for display: headings and the big numbers. Body stays on the
       system stack so first paint over 4G is unchanged. */
    .dsp { font-family: Archivo, system-ui, sans-serif; font-weight: 800;
           letter-spacing: -0.02em; margin: 0; }
    h1.dsp { font-size: 28px; line-height: 1.1; }
    h2.dsp { font-size: 13px; font-weight: 700; letter-spacing: 0.09em;
             text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
    .num { font-variant-numeric: tabular-nums; font-family: Archivo, system-ui, sans-serif; }
    .card { background: var(--surface); border: 1px solid var(--line);
            border-radius: 14px; padding: 16px; }
    .btn { font: inherit; font-weight: 700; min-height: 48px; width: 100%;
           border: 0; border-radius: 12px; background: var(--accent);
           color: var(--accent-ink); cursor: pointer; display: flex;
           align-items: center; justify-content: center; gap: 8px; }
    .btn.sec { background: var(--raised); color: var(--ink);
               border: 1px solid var(--line); }
    .btn.ghost { background: transparent; color: var(--muted);
                 border: 1px solid var(--line); min-height: 44px; }
    .fld { font: inherit; color: var(--ink); background: var(--raised);
           border: 1px solid var(--line); border-radius: 12px; min-height: 48px;
           padding: 12px 14px; width: 100%; }
    .lbl { font-size: 13px; font-weight: 700; color: var(--muted);
           letter-spacing: 0.04em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .sm { font-size: 14px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stack { display: flex; flex-direction: column; }
    .pill { font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
            text-transform: uppercase; padding: 4px 9px; border-radius: 999px;
            border: 1px solid var(--line); color: var(--muted); }
    .pill.live { color: var(--accent-ink); background: var(--accent);
                 border-color: transparent; }
    .pill.warn { color: var(--warn); border-color: var(--warn); }
  </style>
</helmet>
<div class="scr {{theme}}">

  <div>
    <h1 class="dsp" style="font-size:24px">Invite players</h1>
    <p class="muted sm" style="margin:2px 0 0">They scan or follow the link, sign in, and they're in the field.</p>
  </div>

  <div class="card" style="text-align:center; padding:22px 16px">
    <div class="num dsp" style="font-size:34px; letter-spacing:0.14em">THR-8K2QF</div>
    <div style="width:184px; height:184px; margin:18px auto; background:#fff; border-radius:12px; padding:12px">
      <svg viewBox="0 0 21 21" width="160" height="160" shape-rendering="crispEdges" aria-label="QR code">
        <rect width="21" height="21" fill="#fff"></rect>
        <g fill="#000">
          <path d="M0 0h7v7H0zM1 1v5h5V1z M2 2h3v3H2z"></path>
          <path d="M14 0h7v7h-7zM15 1v5h5V1z M16 2h3v3h-3z"></path>
          <path d="M0 14h7v7H0zM1 15v5h5v-5z M2 16h3v3H2z"></path>
          <path d="M9 0h1v3H9zM11 1h1v2h-1zM8 4h2v1H8zM11 5h2v1h-2zM9 6h1v2H9z"></path>
          <path d="M0 9h2v1H0zM3 9h1v2H3zM5 10h2v1H5zM1 11h2v1H1zM4 12h1v1H4zM6 8h1v2H6z"></path>
          <path d="M9 9h1v1H9zM11 9h2v1h-2zM10 11h1v2h-1zM12 12h1v1h-1zM8 13h2v1H8zM13 10h1v2h-1z"></path>
          <path d="M14 9h1v2h-1zM16 10h2v1h-2zM19 9h2v1h-2zM15 12h1v1h-1zM17 13h2v1h-2z"></path>
          <path d="M9 15h1v2H9zM11 16h2v1h-2zM8 18h2v1H8zM12 19h1v2h-1zM10 20h1v1h-1z"></path>
          <path d="M14 15h2v1h-2zM17 16h1v2h-1zM19 15h1v1h-1zM15 18h2v1h-2zM18 19h2v1h-2zM14 20h1v1h-1z"></path>
        </g>
      </svg>
    </div>
    <button class="btn">Copy join link</button>
  </div>

  <div class="card">
    <h2 class="dsp">If the link gets out</h2>
    <p class="muted sm" style="margin:0 0 13px">Replacing it stops anyone holding the old link or a printed code from joining. People already in the field stay in.</p>
    <button class="btn ghost">Replace this link</button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;lit&quot;],&quot;default&quot;:&quot;lit&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
