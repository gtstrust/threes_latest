<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap">
  <style>
    :root {
      /* Dark: the brand register. Near-black with a green cast rather than
         neutral grey, so the app reads as one colour family. */
      --page: #0b0f0c;
      --surface: #141a15;
      --raised: #1c241d;
      --line: #263028;
      --ink: #f2f6f2;
      --muted: #8fa091;
      /* Luminous green for state. The shipped brand green (#1b5e20) is too
         dark to carry contrast on near-black, so this is its bright sibling. */
      --accent: #4ade80;
      --accent-ink: #06210f;
      --warn: #fbbf24;
      --danger: #f87171;
    }
    .lit {
      /* High-luminance: the on-course theme. Bright screens beat dark ones in
         direct sun, which is where score entry actually happens. */
      --page: #ffffff;
      --surface: #ffffff;
      --raised: #f1f4f1;
      --line: #d9e0da;
      --ink: #0d130e;
      --muted: #5b665c;
      --accent: #1b5e20;
      --accent-ink: #ffffff;
      --warn: #92610a;
      --danger: #a4231f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--accent); }
    a:hover { color: var(--ink); }
    .scr {
      width: 390px; min-height: 844px; background: var(--page); color: var(--ink);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 17px; line-height: 1.45; padding: 20px 18px 28px;
      display: flex; flex-direction: column; gap: 14px;
    }
    /* Archivo only for display: headings and the big numbers. Body stays on the
       system stack so first paint over 4G is unchanged. */
    .dsp { font-family: Archivo, system-ui, sans-serif; font-weight: 800;
           letter-spacing: -0.02em; margin: 0; }
    h1.dsp { font-size: 28px; line-height: 1.1; }
    h2.dsp { font-size: 13px; font-weight: 700; letter-spacing: 0.09em;
             text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
    .num { font-variant-numeric: tabular-nums; font-family: Archivo, system-ui, sans-serif; }
    .card { background: var(--surface); border: 1px solid var(--line);
            border-radius: 14px; padding: 16px; }
    .btn { font: inherit; font-weight: 700; min-height: 48px; width: 100%;
           border: 0; border-radius: 12px; background: var(--accent);
           color: var(--accent-ink); cursor: pointer; display: flex;
           align-items: center; justify-content: center; gap: 8px; }
    .btn.sec { background: var(--raised); color: var(--ink);
               border: 1px solid var(--line); }
    .btn.ghost { background: transparent; color: var(--muted);
                 border: 1px solid var(--line); min-height: 44px; }
    .fld { font: inherit; color: var(--ink); background: var(--raised);
           border: 1px solid var(--line); border-radius: 12px; min-height: 48px;
           padding: 12px 14px; width: 100%; }
    .lbl { font-size: 13px; font-weight: 700; color: var(--muted);
           letter-spacing: 0.04em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .sm { font-size: 14px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stack { display: flex; flex-direction: column; }
    .pill { font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
            text-transform: uppercase; padding: 4px 9px; border-radius: 999px;
            border: 1px solid var(--line); color: var(--muted); }
    .pill.live { color: var(--accent-ink); background: var(--accent);
                 border-color: transparent; }
    .pill.warn { color: var(--warn); border-color: var(--warn); }
  </style>
</helmet>
<div class="scr {{theme}}">

  <div class="row">
    <div>
      <h1 class="dsp" style="font-size:24px">Scorecard</h1>
      <p class="muted sm" style="margin:2px 0 0">Group 2 · holes 4–6</p>
    </div>
    <span class="pill">Complete</span>
  </div>

  <div class="card" style="padding:0; overflow:hidden">
    <div style="display:grid; grid-template-columns:1.5fr repeat(3, minmax(0,1fr)) 0.9fr; gap:0">
      <div class="lbl" style="padding:12px 14px; border-bottom:1px solid var(--line)">Player</div>
      <div class="lbl num" style="padding:12px 6px; text-align:center; border-bottom:1px solid var(--line)">4</div>
      <div class="lbl num" style="padding:12px 6px; text-align:center; border-bottom:1px solid var(--line)">5</div>
      <div class="lbl num" style="padding:12px 6px; text-align:center; border-bottom:1px solid var(--line)">6</div>
      <div class="lbl" style="padding:12px 14px 12px 6px; text-align:right; border-bottom:1px solid var(--line)">Pts</div>

      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="padding:13px 14px; border-bottom:1px solid var(--line); font-weight:600">{{r.name}}</div>
        <div style="padding:9px 6px; text-align:center; border-bottom:1px solid var(--line)">
          <span class="num" style="display:inline-flex; width:30px; height:30px; align-items:center; justify-content:center; border-radius:999px; {{r.m1}}">{{r.h1}}</span></div>
        <div style="padding:9px 6px; text-align:center; border-bottom:1px solid var(--line)">
          <span class="num" style="display:inline-flex; width:30px; height:30px; align-items:center; justify-content:center; border-radius:999px; {{r.m2}}">{{r.h2}}</span></div>
        <div style="padding:9px 6px; text-align:center; border-bottom:1px solid var(--line)">
          <span class="num" style="display:inline-flex; width:30px; height:30px; align-items:center; justify-content:center; border-radius:999px; {{r.m3}}">{{r.h3}}</span></div>
        <div class="num dsp" style="padding:13px 14px 13px 6px; text-align:right; border-bottom:1px solid var(--line)">{{r.pts}}</div>
      </sc-for>
    </div>
  </div>

  <p class="muted sm" style="margin:0">A ring marks the hole that player took.</p>

  <div class="card">
    <div class="row"><span class="muted sm">Won on strokes</span><span style="font-weight:600">Hole 4 · Kim</span></div>
    <div class="row" style="margin-top:9px"><span class="muted sm">Tied on 4 — closest to the pin</span><span style="font-weight:600">Hole 5 · Dave</span></div>
    <div class="row" style="margin-top:9px"><span class="muted sm">All level on 5 — nobody won</span><span style="font-weight:600">Hole 6</span></div>
  </div>
  <button class="btn sec">See the leaderboard</button>

</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","lit"],"default":"lit","section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'lit', rows: [{name:'Kim',h1:'4',h2:'4',h3:'5',pts:'1',m1:'border:2px solid var(--accent); font-weight:800',m2:'border:2px solid transparent',m3:'border:2px solid transparent'},{name:'Dave',h1:'5',h2:'4',h3:'5',pts:'1',m1:'border:2px solid transparent',m2:'border:2px solid var(--accent); font-weight:800',m3:'border:2px solid transparent'},{name:'Sam',h1:'6',h2:'5',h3:'5',pts:'0',m1:'border:2px solid transparent',m2:'border:2px solid transparent',m3:'border:2px solid transparent'}] };
  }
}
</script>
</body>
</html>
