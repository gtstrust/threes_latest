name: Reminder Sweep

# Mails the field of any tournament starting within a day that hasn't been told
# yet. The endpoint is idempotent — it excludes events that already have an
# UPCOMING reminder recorded — so a duplicate or retried run costs nothing.
#
# MANUAL FOR NOW. It shipped on an hourly cron against a backend that does not
# exist yet, so every run failed on an empty API_BASE_URL — an alarm with nothing
# behind it, which is worse than no alarm, because people learn to ignore it.
#
# TO TURN IT ON, once the backend is deployed and API_BASE_URL and CRON_SECRET
# are set as repository secrets under the `production` environment, restore:
#
#   schedule:
#     - cron: "7 * * * *"
#
# Hourly rather than daily, because an event at 9am should not have its reminder
# decided by what time a daily job happens to run. Note GitHub throttles and
# skips scheduled workflows on quiet repositories — the observed cadence here was
# a few times a day, not hourly — which is fine for a day-ahead reminder and
# would not be for a tee-time one.
on:
  workflow_dispatch:

concurrency:
  group: reminder-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Two secrets, neither of which this workflow can usefully do without:
    #   API_BASE_URL — where the deployed backend is
    #   CRON_SECRET  — must match the backend's; without it the route 403s
    environment: production

    steps:
      - name: Sweep
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            "${API_BASE_URL%/}/internal/reminders/sweep" \
            -H "X-Cron-Key: ${CRON_SECRET}")
          body=$(printf '%s' "$response" | sed '$d')
          code=$(printf '%s' "$response" | tail -n1)

          echo "$body"
          # Fail loudly on anything but 200. A sweep that silently 403s for weeks
          # is worse than one that never existed, because nobody looks.
          if [ "$code" != "200" ]; then
            echo "Sweep failed with HTTP $code" >&2
            exit 1
          fi
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
